name: Flutter quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Dart syntax
        run: dart format --output=none lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Compile test APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid
