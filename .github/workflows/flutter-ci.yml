name: Flutter V1 CI

on:
  push:
    branches:
      - main
      - codex/sync-production-flutter
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Core repository tests
        run: flutter test test/api_client_test.dart test/app_config_test.dart test/app_state_test.dart test/auth_repository_test.dart test/cart_controller_test.dart test/catalog_repository_test.dart test/checkout_repository_test.dart test/models_test.dart
