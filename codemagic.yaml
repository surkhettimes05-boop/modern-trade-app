workflows:
  android-test-apk:
    name: Android test APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build downloadable APK
        script: |
          flutter build apk --debug \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL="${API_BASE_URL:-http://10.0.2.2:3001}"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log

  android-release:
    name: PASALHO Android release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - pasalho_android_signing
      vars:
        ANDROID_KEYSTORE_PATH: /tmp/pasalho-release.jks
    scripts:
      - name: Validate release configuration
        script: |
          for name in API_BASE_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Missing required Codemagic secret: $name"
              exit 1
            fi
          done
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL must be an HTTPS URL"; exit 1 ;;
          esac
      - name: Restore signing keystore
        script: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Configure Android SDK
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Verify formatting
        script: dart format --output=none --set-exit-if-changed .
      - name: Analyze source
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Diagnose Flutter release arguments
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Flutter executable: $(command -v flutter)"
          type flutter || true
          flutter --version
          flutter config --list
          for name in API_BASE_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPPORT_PHONE PRIVACY_POLICY_URL TERMS_URL; do
            if [ -n "${!name:-}" ]; then
              echo "$name=SET"
            else
              echo "$name=UNSET"
            fi
          done
          echo "Release args: build apk --release --target=lib/main.dart --dart-define=APP_ENV=production --dart-define=API_BASE_URL=<redacted> --dart-define=SUPPORT_PHONE=<redacted-or-empty> --dart-define=PRIVACY_POLICY_URL=<redacted-or-empty> --dart-define=TERMS_URL=<redacted-or-empty>"
      - name: Build signed release APK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          args=(
            build
            apk
            --release
            --target=lib/main.dart
            --dart-define=APP_ENV=production
            "--dart-define=API_BASE_URL=$API_BASE_URL"
            "--dart-define=SUPPORT_PHONE=${SUPPORT_PHONE:-}"
            "--dart-define=PRIVACY_POLICY_URL=${PRIVACY_POLICY_URL:-}"
            "--dart-define=TERMS_URL=${TERMS_URL:-}"
          )
          flutter "${args[@]}"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
